<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zachary Glassman</title>
  <meta name="description" content="Zachary Glassman — data professional." />
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(17, 26, 43, 0.86);
      --text: #e8eefc;
      --muted: #a9b8d8;
      --accent: #6ea8ff;
      --border: rgba(167, 190, 238, 0.25);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(700px 400px at 85% -10%, rgba(110, 168, 255, .22), transparent 62%),
        linear-gradient(165deg, #08101e 0%, #0b1220 60%, #121d32 100%);
      overflow: hidden;
      position: relative;
    }

    #pattern {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      width: min(100%, 700px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: .65rem 0 1.4rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: .7rem;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      border-radius: 999px;
      padding: .6rem 1rem;
      font-weight: 600;
      border: 1px solid rgba(180, 200, 240, .45);
      color: var(--text);
      background: rgba(20, 29, 48, .65);
    }

    a.primary {
      border-color: transparent;
      color: #071126;
      background: linear-gradient(135deg, var(--accent), #8abaff);
    }

    footer {
      margin-top: 1.3rem;
      color: #7f92b8;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <canvas id="pattern" aria-hidden="true"></canvas>

  <main class="card">
    <h1>Zachary Glassman</h1>
    <p>Data professional.</p>

    <div class="links">
      <a class="primary" href="mailto:zach.glassman@gmail.com">Email</a>
      <a href="https://github.com/zachglassman">GitHub</a>
      <a href="https://www.linkedin.com/in/zachary-glassman-7088844b/">LinkedIn</a>
    </div>

    <footer>© <span id="year"></span></footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const canvas = document.getElementById('pattern');
    const ctx = canvas.getContext('2d');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const randomInRange = (min, max) => min + Math.random() * (max - min);

    const gcd = (a, b) => {
      while (b !== 0) {
        [a, b] = [b, a % b];
      }
      return a;
    };

    const makeFamily = (width, height) => {
      let a = Math.floor(randomInRange(2, 10));
      let b = Math.floor(randomInRange(3, 11));

      while (gcd(a, b) !== 1) {
        a = Math.floor(randomInRange(2, 10));
        b = Math.floor(randomInRange(3, 11));
      }

      return {
        a,
        b,
        basePhase: randomInRange(0, Math.PI * 2),
        phaseVelocity: randomInRange(-0.34, 0.34),
        centerX: randomInRange(width * 0.18, width * 0.82),
        centerY: randomInRange(height * 0.18, height * 0.82),
        radiusX: randomInRange(width * 0.12, width * 0.34),
        radiusY: randomInRange(height * 0.12, height * 0.3),
        stroke: `hsla(${Math.floor(randomInRange(195, 240))}, 90%, ${Math.floor(randomInRange(62, 78))}%, ${randomInRange(0.12, 0.22).toFixed(3)})`,
        lineWidth: randomInRange(0.9, 1.6),
      };
    };

    let width = window.innerWidth;
    let height = window.innerHeight;
    let families = [];
    const familyCount = 3;
    const steps = 1400;
    let animationFrameId = null;
    const startTime = performance.now();

    const resizeCanvas = () => {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const regenerateFamilies = () => {
      families = Array.from({ length: familyCount }, () => makeFamily(width, height));
    };

    const drawPattern = (elapsedMs = 0) => {
      const seconds = elapsedMs / 1000;
      ctx.clearRect(0, 0, width, height);

      for (const family of families) {
        ctx.beginPath();

        for (let step = 0; step <= steps; step += 1) {
          const t = (step / steps) * (Math.PI * 2);
          const phase = family.basePhase + family.phaseVelocity * seconds;
          const x = family.centerX + family.radiusX * Math.sin(family.a * t + phase);
          const y = family.centerY + family.radiusY * Math.sin(family.b * t - phase * 0.55);

          if (step === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.strokeStyle = family.stroke;
        ctx.lineWidth = family.lineWidth;
        ctx.stroke();
      }
    };

    const animate = (now) => {
      drawPattern(now - startTime);
      animationFrameId = window.requestAnimationFrame(animate);
    };

    const restart = () => {
      resizeCanvas();
      regenerateFamilies();
      drawPattern(0);
    };

    restart();

    if (!prefersReducedMotion) {
      animationFrameId = window.requestAnimationFrame(animate);
    }

    window.addEventListener('resize', restart);
    window.addEventListener('click', () => {
      regenerateFamilies();
      if (prefersReducedMotion) {
        drawPattern(0);
      }
    });
    window.addEventListener('beforeunload', () => {
      if (animationFrameId !== null) {
        window.cancelAnimationFrame(animationFrameId);
      }
    });
  </script>
</body>
</html>
